{% extends "base.html" %}
{% block title %}Criar conta · TrailUp{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="eyebrow">Comece agora</div>
    <h2>Criar conta</h2>
    <form method="post" class="form-grid">
      <label>Nome<input name="nome" required autocomplete="name"></label>
      <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
      <label>Senha<input type="password" name="senha" required minlength="6" autocomplete="new-password"></label>
      <button class="button primary" type="submit">Cadastrar</button>
    </form>
    <p class="muted" style="margin-top:16px">Já tem conta? <a href="{{ url_for('web_bp.login') }}" style="color:var(--accent-2)">Entrar</a>.</p>
  </div>
</div>
{% endblock %}
